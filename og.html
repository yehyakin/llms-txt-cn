<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:1200px; height:630px; background:#0c0c0e; color:#f4f1e9;
    font-family:"Noto Serif SC", serif; position:relative; overflow:hidden;
    display:flex; flex-direction:column; justify-content:space-between;
    padding:64px 72px;
  }
  body::after {
    content:""; position:absolute; inset:0; pointer-events:none; opacity:.5;
    background:radial-gradient(600px 400px at 85% 15%, rgba(210,255,0,.07), transparent 60%);
  }
  .top { font-family:"JetBrains Mono", monospace; font-size:22px; letter-spacing:.35em; color:#d2ff00; }
  .top span { color:#97958d; letter-spacing:.2em; }
  h1 { font-size:118px; font-weight:900; line-height:1.25; letter-spacing:.02em; }
  h1 .acc { color:#d2ff00; }
  .bot { display:flex; justify-content:space-between; align-items:flex-end;
    border-top:1px solid rgba(244,241,233,.16); padding-top:28px; }
  .bot .l { font-family:"JetBrains Mono", monospace; font-size:24px; letter-spacing:.25em; color:#97958d; }
  .bot .r { font-family:"JetBrains Mono", monospace; font-size:26px; color:#f4f1e9; }
  .bot .r b { color:#d2ff00; font-weight:700; }
</style>
</head>
<body>
  <div class="top">CETXT <span>/ LLMS.TXT 中文工具</span></div>
  <h1>给 AI 的<br><span class="acc">网站说明书</span>。</h1>
  <div class="bot">
    <div class="l">生成 · 校验 · 部署</div>
    <div class="r"><b>cetxt</b>.com</div>
  </div>
</body>
</html>
