# 预览部署：cetxt-preview.<subdomain>.workers.dev。不要加 cetxt.com 路由。
name = "cetxt-preview"
main = "worker/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

[build]
command = "node scripts/build-worker.mjs"

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = true
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"

# 按 IP 限频：每 60 秒 20 次（与旧版 check.py 一致）
[[ratelimits]]
name = "RL"
namespace_id = "20261031"
simple = { limit = 20, period = 60 }

# 只按天记 verdict（不记域名 / IP）
[[analytics_engine_datasets]]
binding = "STATS"
dataset = "cetxt_verdicts"
