<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!--HEAD--><title>AI crawler access report · cetxt</title>
<meta name="robots" content="noindex"><!--/HEAD--><meta name="theme-color" content="#ffffff">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/en/app.css">
</head><body>
<nav class="nav"><div class="wrap">
  <a class="logo" href="/en/"><i></i>cetxt</a>
  <a class="n hide-m" href="/en/#checks">What we check</a>
  <a class="n lang" href="/">中文</a>
</div></nav>

<main class="wrap">
  <div class="rp-head top">
    <div><div class="crumb">AI crawler access report</div><h1 id="dom"><!--DOM-->…<!--/DOM--></h1><div class="meta" id="meta"><!--META--><!--/META--></div></div>
    <form class="rp-search" id="f" autocomplete="off"><div class="field" style="flex:1"><input id="d" placeholder="Check another domain" aria-label="Domain" spellcheck="false" autocapitalize="off"><button class="btn">Check</button></div></form>
  </div>
  <div id="out"><!--OUT--><div class="loading" id="ld"><div class="spin"></div>Requesting the homepage as 13 different clients…<div class="steps">robots.txt · firewall · page content</div></div><!--/OUT--></div>
</main>
<footer><div class="wrap"><span>© 2026 cetxt</span><a href="/en/">Home</a><span>Results are cached for 5 minutes.</span></div></footer>

<script type="module">
import {renderReport,bindReport,cleanDomain,esc} from '/en/view.js';
const $=s=>document.querySelector(s);
$('#f').addEventListener('submit',e=>{e.preventDefault();const c=cleanDomain($('#d').value);if(c)location.href='/en/report/'+c});
const out=$('#out');
function show(j){const o=renderReport(j,{url:location.origin+'/en/report/'+j.domain});$('#meta').innerHTML=o.meta;out.innerHTML=o.html;document.title=j.domain+' · AI crawler access report · cetxt';bindReport(document)}
function fail(m){out.innerHTML='<div class="loading">'+esc(m)+'</div>'}
const m=location.pathname.match(/^\/en\/report\/([^/]+)\/?$/);
const qd=new URLSearchParams(location.search).get('d');
const dom=cleanDomain(m?decodeURIComponent(m[1]):qd);
if(qd&&dom&&!m)location.replace('/en/report/'+dom);
else if(!dom){$('#dom').textContent='Enter a domain';out.innerHTML='';$('#d').focus()}
else if(out.querySelector('.verdict')||out.querySelector('.loading:not(#ld)'))bindReport(document);
else{
  $('#dom').textContent=dom;
  fetch('/api/check?access=1&domain='+encodeURIComponent(dom)).then(r=>r.json().then(j=>[r.status,j])).then(([s,j])=>{
    if(s===429)return fail('Too many checks from your network. Try again in a minute.');
    if(j.error)return fail(j.error==='bad_domain'?'That doesn’t look like a valid domain.':'Something went wrong.');
    show(j)
  }).catch(()=>fail('The check timed out. The site may be very slow or unreachable.'));
}
</script>
</body></html>
